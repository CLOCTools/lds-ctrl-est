name: Build and Test ldsCtrlEst

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up dependencies for macOS and Linux
      if: runner.os != 'Windows'
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          brew install ninja
        elif [ "${{ runner.os }}" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build gfortran pkg-config
        fi
  
    - name: Set up CMake 3.31.6 (before vcpkg)
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.31.6'

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
        runVcpkgInstall: true
        
    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: build
        key: build-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          build-${{ matrix.os }}-
          
    - name: Configure and build for macOS/Linux
      if: runner.os != 'Windows'
      uses: lukka/run-cmake@v10
      with:
        cmakeListsTxtPath: CMakeLists.txt
        configurePreset: 'linux-release'
        buildPreset: 'linux-release'

    - name: Configure and build for Windows
      if: runner.os == 'Windows'
      uses: lukka/run-cmake@v10
      with:
        cmakeListsTxtPath: CMakeLists.txt
        configurePreset: 'windows-release'
        buildPreset: 'windows-release'
        buildPresetAdditionalArgs: "['--config Release']"
        
    - name: Install and Update PATH (Windows only)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --install .
        echo "${{github.workspace}}/install/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Run tests
      run: |
        cd build
        ctest -C Release --output-on-failure

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up dependencies for macOS and Linux
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          brew install ninja
        elif [ "${{ runner.os }}" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build gfortran pkg-config
        fi

    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install numpy matplotlib pytest

    - name: Set up CMake 3.31.6 (before vcpkg)
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.31.6'

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
        runVcpkgInstall: true

    - name: Configure and build Python bindings
      uses: lukka/run-cmake@v10
      with:
        cmakeListsTxtPath: CMakeLists.txt
        configurePreset: 'linux-release'
        configurePresetAdditionalArgs: "['-DLDSCTRLEST_BUILD_PYTHON=ON', '-DLDSCTRLEST_BUILD_FIT=ON', '-DLDSCTRLEST_BUILD_EXAMPLES=OFF', '-DLDSCTRLEST_BUILD_TESTS=OFF', '-DLDSCTRLEST_BUILD_STATIC=OFF', '-DPython3_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}']"
        buildPreset: 'linux-release'

    - name: Run pytest suite
      working-directory: build/python
      run: PYTHONPATH=. python -m pytest tests/ -v
